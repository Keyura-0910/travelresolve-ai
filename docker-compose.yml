version: "3.8"

services:
  travelresolve-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travelresolve_app
    ports:
      - "8000:8000"   # FastAPI Backend
      - "8501:8501"   # Streamlit UI
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:////app/data/travelresolve.db
      - LLM_PROVIDER=local
      - EMBEDDING_PROVIDER=local
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - travelresolve_data:/app/data

volumes:
  travelresolve_data:
